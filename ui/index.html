<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Central Telecom · Atendimento</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head><body><header><div class="wrap mast"><strong>Central Telecom</strong><span>Operadora fictícia</span></div></header><main class="wrap"><h1>Atendimento técnico e comercial</h1><nav aria-label="Áreas da central"><button data-view="chat" aria-current="page">Conversa</button><button data-view="queue">Fila humana</button><button data-view="metrics">Indicadores</button></nav><section id="chat"><div class="bar"><label>Perfil de teste <select id="account"><option value="A">A · Centro</option><option value="B">B · Norte</option></select></label><button id="new">Nova conversa</button></div><p class="muted" id="status" role="status"></p><div id="history" aria-live="polite"></div><form id="composer"><label for="question">Sua mensagem</label><textarea id="question" maxlength="1000" required placeholder="Minha fatura veio mais cara. Pode conferir?"></textarea><button class="primary" id="send">Enviar</button></form></section><section id="queue" hidden><h2>Casos encaminhados</h2><div id="tickets"></div></section><section id="metrics" hidden><h2>Indicadores desta instalação</h2><div id="cards"></div><h3>Motivos de encaminhamento</h3><ul id="reasons"></ul><h3>Alertas</h3><ul id="alarms"></ul></section><p id="notice" role="alert"></p></main></body></html>
